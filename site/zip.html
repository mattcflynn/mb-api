<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MacroBell — Local Prices</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔔</text></svg>">
</head>
<body>
  <div id="header"></div>

  <div class="layout">
    <main class="board-col">
      <div class="menu-board">
        <h1 class="board-title" id="zip-title">Local Menu</h1>
        <p class="board-sub" id="board-sub"></p>
        <div id="notice"></div>
        <div id="menu" class="loading">SCANNING YOUR AREA...</div>
      </div>
    </main>

    <aside class="side-col">
      <div class="panel">
        <h2>🔍 Try Another ZIP</h2>
        <form class="zip-form" id="zip-form">
          <input type="text" id="zip-input" inputmode="numeric" pattern="[0-9]{5}"
                 maxlength="5" placeholder="ZIP CODE" aria-label="ZIP code">
          <button type="submit">GO</button>
        </form>
      </div>

      <div class="panel">
        <h2>💸 Cheapest 5 Near You</h2>
        <table id="lo5"><tbody></tbody></table>
      </div>

      <div class="panel">
        <h2>💰 Priciest 5 Near You</h2>
        <table id="hi5"><tbody></tbody></table>
      </div>

      <div class="panel">
        <h2>⬅ Back</h2>
        <a class="btn" href="index.html">National Board</a>
      </div>
    </aside>
  </div>

  <div id="footer"></div>
  <script type="module" src="js/zip.js"></script>
</body>
</html>
