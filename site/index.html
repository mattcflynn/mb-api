<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MacroBell — 90s Taco Bell Menu Prices</title>
  <meta name="description" content="National average Taco Bell prices on a vintage 90s menu board. Drill into any item for price history and hi/lo locations.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔔</text></svg>">
</head>
<body>
  <div id="header"></div>

  <div class="layout">
    <main class="board-col">
      <div class="menu-board">
        <h1 class="board-title">Menu Board</h1>
        <p class="board-sub" id="board-sub">national average prices</p>
        <div id="menu" class="loading">LOADING MENU...</div>
      </div>
    </main>

    <aside class="side-col">
      <div class="panel">
        <h2>🔍 Your Local Prices</h2>
        <form class="zip-form" id="zip-form">
          <input type="text" id="zip-input" inputmode="numeric" pattern="[0-9]{5}"
                 maxlength="5" placeholder="ZIP CODE" aria-label="ZIP code">
          <button type="submit">GO</button>
        </form>
      </div>

      <div class="panel">
        <h2>💸 Cheapest 5 Stores (USA)</h2>
        <table id="lo5"><tbody></tbody></table>
        <p style="margin:8px 0 0;text-align:right;font-size:11px">
          <a href="rankings.html?sort=cheap">See full rankings →</a></p>
      </div>

      <div class="panel">
        <h2>💰 Priciest 5 Stores (USA)</h2>
        <table id="hi5"><tbody></tbody></table>
        <p style="margin:8px 0 0;text-align:right;font-size:11px">
          <a href="rankings.html?sort=pricey">See full rankings →</a></p>
      </div>

      <div class="panel">
        <h2>🧮 MacroBell Tool</h2>
        <p style="font-size:12px;margin:0 0 10px">Sort the menu by protein-per-dollar. Filter any macro.</p>
        <a class="btn" href="macrobell.html">Open Analyzer</a>
      </div>
    </aside>
  </div>

  <div id="footer"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
